<!DOCTYPE html><html lang="en"><head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Gameunity — Pricing & Subscription</title>
    <meta name="description" content="Gameunity subscription plans — Free, Plus, and Ultra Pro.">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&amp;family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&amp;display=swap" rel="stylesheet">
    <link href="../css/global.css" rel="stylesheet">
    <link href="../css/components/sidebar.css" rel="stylesheet">
    <link href="../css/pages/admin-dashboard.css" rel="stylesheet">
    <link href="../css/pages/pricing.css" rel="stylesheet">
</head>
<body>

    <div class="app-shell">
      <div id="sidebar-container"></div>

      <div class="main">
        <header class="header">
            <div class="header-left">
                <div class="header-icon">💎</div>
                <h1 class="header-title">Pricing & Subscription</h1>
                <span class="header-badge">PLANS</span>
            </div>
            <div class="header-right">
                <div class="header-avatar user-avatar" onclick="window.location.href='profile-settings.html'"></div>
            </div>
        </header>

        <div class="page active">
            <p class="pricing-intro">Free gets you started. Plus and Ultra Pro unlock bigger communities, more moderators, and premium extras. Upgrades are simulated for this build — no real payment is taken.</p>

            <div class="plan-grid" id="planGrid">
                <!-- filled by pricing.js -->
            </div>

            <div class="card" style="max-width:520px;">
                <div class="card-header"><h3>Need to cancel?</h3></div>
                <p style="font-size:13px;color:var(--text-3,#888);margin-bottom:14px;">Cancelling reverts you to the Free plan immediately.</p>
                <button class="btn-ghost" onclick="cancelSubscription()">Cancel current subscription</button>
            </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span id="toastIcon">✅</span>
        <span id="toastMsg">Action applied</span>
    </div>

    <script src="../js/core/auth.js"></script>
    <script src="../js/core/apiClient.js"></script>
    <script src="../js/pages/pricing.js"></script>
    <script src="../js/components/sidebar.js"></script>
</body></html>
